<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c16" width="16" height="16" style="display:none"></canvas>
<canvas id="c48" width="48" height="48" style="display:none"></canvas>
<canvas id="c128" width="128" height="128" style="display:none"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext("2d");
  const s = canvas.width;
  ctx.fillStyle = "#6c63ff";
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.18);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = `bold ${s * 0.6}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("⚡", s / 2, s / 2);
}
["c16","c48","c128"].forEach(id => {
  const c = document.getElementById(id);
  drawIcon(c);
  const a = document.createElement("a");
  a.download = `icon${c.width}.png`;
  a.href = c.toDataURL("image/png");
  a.textContent = `Download icon${c.width}.png`;
  a.style.display = "block";
  a.style.margin = "8px";
  document.body.appendChild(a);
});
</script>
</body>
</html>
