<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACM Product Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0e17;
      color: #e0deff;
      font-size: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid #2a2840;
    }
    .header-icon { font-size: 22px; }
    .header-title { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: #7c73c0; margin-top: 1px; }

    .body { padding: 16px 18px; }

    #state-idle, #state-loading, #state-result, #state-error { display: none; }
    #state-idle.active, #state-loading.active, #state-result.active, #state-error.active { display: block; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #6c63ff; color: #fff; }
    .btn-secondary { background: #1e1c30; color: #e0deff; border: 1px solid #2a2840; }

    .loading-wrap {
      text-align: center;
      padding: 24px 0;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2a2840;
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #7c73c0; font-size: 13px; }

    .product-img-wrap {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 4px;
    }
    .product-img-wrap img {
      width: 56px; height: 56px;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #2a2840;
      flex-shrink: 0;
    }
    .product-img-wrap img:first-child {
      width: 80px; height: 80px;
      border-color: #6c63ff;
    }

    .product-title {
      font-weight: 700;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .product-price {
      color: #6c63ff;
      font-weight: 800;
      font-size: 16px;
    }
    .img-count {
      font-size: 11px;
      color: #7c73c0;
      background: #1e1c30;
      border: 1px solid #2a2840;
      border-radius: 20px;
      padding: 2px 8px;
    }

    .btn-gap { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 12px 14px;
      color: #f87171;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .idle-desc {
      color: #7c73c0;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">⚡</div>
    <div>
      <div class="header-title">ACM Product Scraper</div>
      <div class="header-sub">Affiliate Content Machine</div>
    </div>
  </div>

  <div class="body">
    <div id="state-idle">
      <p class="idle-desc">
        Navigate to any affiliate product page (Amazon, eBay, Shopify, etc.), then click <strong>Scrape This Page</strong> to extract all product images and info.
      </p>
      <button class="btn btn-primary" id="scrape-btn">⚡ Scrape This Page</button>
    </div>

    <div id="state-loading">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">Scraping product data…</div>
      </div>
    </div>

    <div id="state-result">
      <div id="img-gallery" class="product-img-wrap"></div>
      <div class="product-title" id="product-title"></div>
      <div class="product-meta">
        <span class="product-price" id="product-price"></span>
        <span class="img-count" id="img-count"></span>
      </div>
      <div class="btn-gap">
        <button class="btn btn-primary" id="generate-btn">🚀 Generate Campaign</button>
        <button class="btn btn-secondary" id="rescrape-btn">↺ Scrape Again</button>
      </div>
    </div>

    <div id="state-error">
      <div class="error-box" id="error-text"></div>
      <button class="btn btn-secondary" id="retry-btn">↺ Try Again</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
